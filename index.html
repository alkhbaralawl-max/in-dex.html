<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1E3A">
<title>ركن الغرب</title>
<style>
:root{--b:#1677D2;--bd:#0B1E3A;--b2:#245A91;--bg:#F3F6FA;--card:#fff;--tx:#172B45;--tx2:#718096;--ok:#20A464;--er:#E5484D;--yl:#FFC83D;--line:#E1E8F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100vh}
#shell{padding-bottom:84px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--bd),var(--b2));color:#fff;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hr{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.lg{width:38px;height:38px;border-radius:12px;background:var(--b);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;border:2px solid #ffffff44;flex-shrink:0}
.lg.big{width:64px;height:64px;font-size:34px;margin:0 auto 8px;border-radius:18px}
.brand b{font-size:16px;display:block;white-space:nowrap}.brand small{font-size:11px;opacity:.8;white-space:nowrap}
.usd{width:40px;height:40px;border-radius:50%;border:0;background:var(--ok);color:#fff;font-size:22px;font-weight:bold;flex-shrink:0;box-shadow:0 0 0 3px #ffffff30}
.bal{background:#00000066;border:0;border-radius:20px;padding:8px 13px;font-weight:bold;color:var(--yl);font-size:14px;min-height:38px;flex-shrink:0}
.ribbon{background:#FFF6D6;color:#7a5a00;font-size:12px;text-align:center;padding:6px 10px;border-bottom:1px solid #f0e2a8}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;font-size:15px;min-height:46px;cursor:pointer;color:#fff;background:var(--b)}
.btn.ok{background:var(--ok)}.btn.y{background:var(--yl);color:var(--bd)}.btn.er{background:var(--er)}.btn.g{background:#E8EEF6;color:var(--tx)}
.btn:disabled{opacity:.45}.btn.full{width:100%}
.ban{margin:12px;border-radius:18px;padding:18px;color:#fff;background:linear-gradient(120deg,var(--b),var(--bd));position:relative;overflow:hidden;min-height:130px}
.ban:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ffffff14;left:-40px;top:-50px}
.ban h2{margin:0 0 6px;font-size:20px;position:relative}.ban p{margin:0 0 12px;font-size:13px;opacity:.95;max-width:70%;position:relative;line-height:1.7}
.ban .em{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:64px}
.ban .btn{position:relative}
.warn{margin:12px;background:#FDECEC;border:1px solid #f6c3c5;color:#9b1c22;border-radius:14px;padding:11px 13px;font-size:13px;line-height:1.8;white-space:pre-line}
.search{margin:0 12px 10px;position:relative}
.search input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 44px 0 12px;font-size:15px;color:var(--tx)}
.search span{position:absolute;right:14px;top:11px;font-size:18px;opacity:.6}
.cats{display:flex;gap:8px;margin:0 12px 12px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:bold;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.sec{margin:14px 14px 8px;font-weight:bold;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.sec small{color:var(--tx2);font-weight:normal;font-size:12px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 2px 8px #0b1e3a14;cursor:pointer}
.art{aspect-ratio:16/8;display:flex;align-items:center;justify-content:center;font-size:62px;position:relative;color:#fff}
.feat .art{aspect-ratio:1/.8;font-size:52px}
.tag{position:absolute;top:8px;right:8px;background:#0000005c;border-radius:10px;padding:3px 9px;font-size:11px;font-weight:bold;color:#fff}
.gi{padding:11px 12px 12px}.gi b{font-size:16px;display:block}.gi p{margin:4px 0 10px;color:var(--tx2);font-size:12.5px;line-height:1.7}
.feat .gi p{display:none}.feat .gi{padding:9px 10px}.feat .gi b{font-size:14px}
.list{display:grid;gap:12px;margin:0 12px}
.empty{margin:20px;text-align:center;color:var(--tx2)}
.edu{margin:10px 14px;color:var(--tx2);font-size:11.5px;line-height:1.8;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--tx2);font-size:10.5px;padding:7px 1px;min-height:56px;position:relative}
.nav button span{display:block;font-size:20px;line-height:1.2}.nav button.on{color:var(--b);font-weight:bold}
.gh{display:flex;align-items:center;gap:10px;margin:12px}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:20px}
.gh h1{margin:0;font-size:19px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:0 12px 12px;box-shadow:0 2px 8px #0b1e3a0f}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border:0}.up{color:var(--ok);font-weight:bold}.dn{color:var(--er);font-weight:bold}
.mrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 14px;margin-bottom:8px;font-size:15px;font-weight:bold;color:var(--tx);text-align:right}
.prof{text-align:center}.av{width:70px;height:70px;border-radius:50%;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:6px auto}
.idb{display:inline-block;background:#E8F1FB;color:var(--b2);border-radius:12px;padding:6px 14px;font-weight:bold;letter-spacing:2px;margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sb{background:#F3F6FA;border-radius:12px;padding:10px 4px;font-size:12px;color:var(--tx2)}.sb b{display:block;font-size:17px;color:var(--tx)}
.note{background:#FFF6D6;color:#7a5a00;border-radius:12px;padding:9px;font-size:12px;text-align:center;margin:0 12px 10px;line-height:1.7}
.authw{padding:24px 14px;max-width:460px;margin:0 auto}
.alogo{text-align:center;margin-bottom:12px}.alogo h1{margin:4px 0;font-size:24px}.alogo small{color:var(--tx2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;border:1px solid var(--line);background:#F3F6FA;border-radius:12px;padding:12px;font-weight:bold;color:var(--tx)}.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.fi{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font-size:16px;margin-bottom:10px;background:#fff;color:var(--tx)}
textarea.fi{height:auto;padding:10px;min-height:80px}
.err{color:var(--er);font-weight:bold;margin-top:8px;font-size:14px;min-height:20px}
.lnk{background:none;border:0;color:var(--b);font-size:13px;margin-top:8px;padding:6px}
.msg{text-align:center;font-weight:bold;min-height:22px;margin-top:8px;font-size:14px}
.amsgbox{background:#E8F1FB;border:1px solid #bcd6f2;color:var(--bd);border-radius:14px;padding:12px;margin-bottom:12px;line-height:1.9;white-space:pre-wrap;font-size:14px}
.resbox{border-radius:14px;padding:12px;margin:0 12px 12px;line-height:1.8;font-size:14px;font-weight:bold}
.resbox.ap{background:#E3F6EC;color:#14532d;border:1px solid #bfe8cf}
.resbox.rj{background:#FDECEC;color:#7f1d1d;border:1px solid #f6c3c5}
.plb{display:block;font-size:13px;color:var(--tx2);margin:8px 0 4px;font-weight:bold}
.pm{font-weight:bold;margin-bottom:6px;line-height:1.8}
.fakewarn{color:var(--er);font-size:12px;font-weight:bold;margin:-6px 0 10px;line-height:1.7}
.upbox{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px;color:var(--tx2);font-size:13px}
.upbox img{max-width:100%;max-height:160px;border-radius:10px;margin-top:8px}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--bd);color:#fff;padding:11px 16px;border-radius:14px;z-index:200;max-width:90%;text-align:center;font-size:14px;box-shadow:0 4px 14px #0006}
#fatal{background:#b00;color:#fff;padding:10px;margin:8px;border-radius:8px;font-size:13px;direction:ltr;text-align:left}
.gl{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;color:#fff}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:#00000055}
.gt{font-size:17px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb{background:#00000066;border-radius:20px;padding:7px 12px;font-weight:bold;color:var(--yl);font-size:13px;white-space:nowrap}
.gx{width:44px;height:44px;border-radius:50%;border:0;background:#ffffff2e;color:#fff;font-size:20px;flex-shrink:0}
.gbody{flex:1;overflow-y:auto;padding:12px 12px 28px;max-width:560px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.gbody.gc{background:#ffffff14;border:1px solid #ffffff26;border-radius:16px;padding:12px;margin-bottom:12px}
.gmsg{text-align:center;font-weight:bold;min-height:26px;margin-bottom:8px;font-size:15px;line-height:1.7}
.gmsg.ok{color:#5BE39A}.gmsg.er{color:#FF8A8F}
.sm2{font-size:12px;color:#cfe1f5;text-align:center;line-height:1.8;margin-bottom:6px}
.bar{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.bar button{flex:1 1 52px;border:1px solid #ffffff33;background:#ffffff1f;border-radius:10px;padding:10px 4px;font-weight:bold;font-size:13px;color:#fff;min-height:42px}
.bar button.on{background:#ffffff55;box-shadow:0 0 0 2px #FFC83D}
.fld{display:flex;gap:8px;margin-bottom:10px}.fld>div{flex:1;min-width:0}
.fld label{font-size:12px;color:#cfe1f5;display:block;margin-bottom:4px}
.fld input{width:100%;height:46px;border-radius:12px;border:0;padding:0 10px;font-size:16px;color:var(--tx);background:#fff}
.two{display:flex;gap:8px}.two .btn{flex:1}
.gd{background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:12px;margin-bottom:12px}.gd summary{font-weight:bold}.gd p,.gd .row2{color:#cfe1f5;font-size:13px;line-height:1.9}
.row2{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #ffffff14}
.hr2{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff1a;font-size:13px}
.hr2 .up{color:#5BE39A}.hr2 .dn{color:#FF8A8F}
.strip{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;min-height:28px}
.cp{border-radius:10px;padding:4px 9px;font-size:12px;font-weight:bold}.cp.lo{background:#E5484D33;color:#FF8A8F}.cp.hi{background:#20A46433;color:#5BE39A}
canvas{display:block;width:100%}
.reels{direction:ltr;display:flex;gap:8px;justify-content:center;margin:8px 0 12px}
.reel{width:30%;max-width:100px;aspect-ratio:.9;background:#fff;color:#000;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,14vw,60px);box-shadow:inset 0 0 10px #0006,0 0 0 3px #f0b429}
.reel.spin{animation:jit .14s infinite}
@keyframes jit{0%{transform:translateY(-4px)}50%{transform:translateY(4px)}100%{transform:translateY(-4px)}}
.aprow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.apm{width:62px;text-align:center;font-weight:bold;font-size:13px;line-height:1.3}.apm small{display:block;font-size:10px;opacity:.75;font-weight:normal}
.ap{flex:1;height:46px;border-radius:12px;border:0;background:#ffffff26;font-size:22px;color:#fff;min-width:0;padding:0;transition:background .15s}
.ap.act{background:#ffffff55;box-shadow:0 0 0 2px #FFC83D}.ap.safe{background:#20A464}.ap.bad{background:#E5484D}.ap.dim{opacity:.35}
.wheelwrap{position:relative;width:min(86vw,320px);margin:10px auto 14px}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:32px;color:var(--yl);z-index:2;text-shadow:0 2px 4px #000}
.wrot{width:100%;transition:transform 4s cubic-bezier(.12,.75,.15,1)}
.plbd{position:relative;height:260px;background:linear-gradient(180deg,#ffffff0c,#00000035);border-radius:14px;margin-bottom:10px;overflow:hidden}
.plpeg{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffffff88;box-shadow:0 0 3px #ffffff55;transform:translate(-50%,-50%)}
.plball{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5b5,var(--yl) 46%,#c17b00 100%);box-shadow:0 0 10px #FFC83D,0 2px 4px #0008;left:50%;top:2%;z-index:2;transform:translate(-50%,-50%);will-change:left,top}
.plbuckets{display:flex;gap:2px}
.btn.on{outline:2px solid var(--yl);outline-offset:1px}
.plbk{flex:1;text-align:center;font-size:10.5px;font-weight:bold;border-radius:6px;padding:5px 1px;background:#ffffff1f;color:#fff;transition:transform .2s,background .2s}
.plbk.hit{background:var(--yl);color:var(--bd);transform:scale(1.15)}
@keyframes popin{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes flashg{0%{box-shadow:0 0 0 0 #4caf50}50%{box-shadow:0 0 24px 8px #4caf50}100%{box-shadow:0 0 0 0 #4caf5000}}
@keyframes flashr{0%{box-shadow:0 0 0 0 #e53935}50%{box-shadow:0 0 24px 8px #e53935}100%{box-shadow:0 0 0 0 #e5393500}}
.bal.fxw{animation:flashg .8s}.bal.fxl{animation:shake .5s,flashr .8s}
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 160px)}
.chatbox{flex:1;overflow-y:auto;padding:0 12px;margin-bottom:8px}
.bub{max-width:78%;padding:9px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.bub.me{background:var(--b);color:#fff;margin-right:auto;border-bottom-left-radius:4px}
.bub.them{background:#fff;border:1px solid var(--line);margin-left:auto;border-bottom-right-radius:4px}
.bub small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.chatin{display:flex;gap:8px;padding:0 12px}
.chatin input{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font-size:15px}
.chatin button{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.ovb{padding:26px 28px;border-radius:22px;text-align:center;color:#fff;min-width:75%;max-width:420px;white-space:pre-line;line-height:1.7}
.ovb.w{background:linear-gradient(#22a447,#14692d);box-shadow:0 0 50px #4caf50;animation:popin .3s}
.ovb.l{background:linear-gradient(#c62828,#7f1414);box-shadow:0 0 50px #e53935;animation:popin .3s,shake .5s .1s}
.ovi{font-size:58px}.ova{font-size:38px;font-weight:bold;margin:4px 0}.ovt{font-size:15px}

.dicearena{display:flex;justify-content:center;align-items:center;gap:18px;padding:20px 10px 12px;perspective:900px}
.diceface{width:clamp(76px,24vw,104px);aspect-ratio:1;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#fff,#dbeafe);color:#10203a;font-size:clamp(48px,15vw,72px);font-weight:900;border:1px solid #ffffffaa;box-shadow:0 14px 28px #0007,inset 0 -5px 0 #9db2d1;transition:transform .2s}
.diceface.rolling{animation:dice-roll .16s infinite}
@keyframes dice-roll{0%{transform:rotate(-10deg) translateY(-5px)}25%{transform:rotate(9deg) translateY(4px)}50%{transform:rotate(-7deg) translateY(-3px)}75%{transform:rotate(8deg) translateY(4px)}100%{transform:rotate(0) translateY(0)}}
#dsum{font-size:18px;font-weight:900;color:#ffdc83;letter-spacing:.2px}
.pickmeta{display:block;font-size:11px;opacity:.85;margin-top:3px;color:#ffe08a}
#dlow,#dseven,#dhigh,#cred,#cblack{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px}
.cardarena{display:flex;justify-content:center;align-items:center;padding:16px 8px 20px;perspective:1000px}
.playingcard{position:relative;width:min(136px,38vw);aspect-ratio:.70;border-radius:17px;border:3px solid #fff;background:linear-gradient(145deg,#f8fafc,#dbeafe);color:#172033;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px 10px;box-shadow:0 18px 38px #0008,inset 0 0 0 4px #d4deed;transform-style:preserve-3d;font-size:38px;font-weight:900}
.playingcard span{align-self:flex-start;font-size:28px}
.playingcard b{font-size:58px;line-height:1}
.playingcard small{font-size:11px;letter-spacing:1px;color:#64748b}
.playingcard.red{color:#dc2626;background:linear-gradient(145deg,#fff,#fee2e2);box-shadow:0 18px 38px #0008,0 0 24px #fb718555,inset 0 0 0 4px #fecaca}
.playingcard.black{color:#111827;background:linear-gradient(145deg,#fff,#e5e7eb);box-shadow:0 18px 38px #0008,0 0 24px #94a3b855,inset 0 0 0 4px #cbd5e1}
.playingcard.flipping{animation:card-flip .48s ease-in-out infinite alternate}
.playingcard.reveal{animation:card-reveal .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes card-flip{0%{transform:rotateY(0) rotateZ(-4deg) scale(.98)}100%{transform:rotateY(180deg) rotateZ(4deg) scale(1.04)}}
@keyframes card-reveal{0%{transform:rotateY(90deg) scale(.92);opacity:.45}70%{transform:rotateY(-10deg) scale(1.06)}100%{transform:rotateY(0) scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.diceface.rolling,.playingcard.flipping,.playingcard.reveal{animation:none}}
</style></head>
<body><div class="app">
<div id="fatal" hidden></div>

<div id="v_auth" class="authw" hidden>
  <div class="alogo"><div class="lg big">R</div><h1 data-t="title"></h1><small>تجربة توعوية • رصيد وهمي</small></div>
  <div class="warn" style="margin:0 0 12px" data-t="notice"></div>
  <div class="card" style="margin:0">
    <div class="tabs"><button id="t_login" class="on" data-t="btnLogin2"></button><button id="t_reg" data-t="btnReg2"></button></div>
    <input class="fi" id="u" data-ph="phUser" autocomplete="username">
    <input class="fi" id="p" type="password" data-ph="phPass" autocomplete="current-password">
    <input class="fi" id="p2" type="password" data-ph="phPass2" autocomplete="new-password" hidden>
    <button class="btn full" id="agb"></button>
    <div class="err" id="aerr"></div>
    <div style="text-align:center"><button class="lnk" id="forgot" data-t="forgotLink"></button></div>
  </div>
</div>

<div id="shell" hidden>
<header class="top">
  <div class="hr"><button class="usd" id="usd">$</button>
    <div class="brand"><div class="lg">R</div><div><b data-t="title"></b><small data-t="subtitle"></small></div></div></div>
  <button class="bal" id="hbal"></button>
</header>
<div class="ribbon" data-t="ribbon"></div>

<main id="v_home">
  <div class="ban" id="ban"><h2 data-t="banT"></h2><p data-t="banD"></p><button class="btn y" id="banbtn" data-t="banBtn"></button><div class="em">🚀</div></div>
  <div id="payreqbanner"></div>
  <div class="warn" data-t="notice"></div>
  <div class="search"><input id="q" data-ph="searchPh"><span>🔎</span></div>
  <div class="cats" id="cats"></div>
  <div id="featbox"><div class="sec" data-t="featTitle"></div><div class="feat" id="feat"></div></div>
  <div class="sec" id="alltop"><span data-t="allTitle"></span> <small id="cnt"></small></div>
  <div class="list" id="list"></div><div class="empty" id="empty" hidden data-t="noGames"></div>
  <div class="edu" data-t="eduNote"></div>

const SYM=[["🤠",.44,0],["🐴",.26,2],["🔫",.16,4],["🥃",.09,8],["💎",.04,16],["👑",.01,20]];
function slotExact(g){
  const P=SYM.map(s=>s[1]),T=SYM.map(s=>s[2]),D=2,cap=capOf(g);
  let lo=0,hi=100;
  for(let i=0;i<52;i++){
    const scale=(lo+hi)/2;let expected=0;
    for(let a=0;a<6;a++)for(let b=0;b<6;b++)for(let c=0;c<6;c++){
      const pr=P[a]*P[b]*P[c];let pay=0;
      if(a===b&&b===c)pay=T[a];else if(a===b||b===c||a===c)pay=D;
      expected+=pr*Math.min(pay*scale,cap);
    }
    if(expected<rtpOf(g)/100)lo=scale;else hi=scale;
  }
  return (lo+hi)/2;
}
function slotPayoutOf(g,a,b,c,scale){
  let pay=0;
  if(a===b&&b===c)pay=SYM[a][2];else if(a===b||b===c||a===c)pay=2;
  return r2(Math.min(pay*scale,capOf(g)));
}

  let c=Math.floor((rtpOf(g)/100)/(1-r)*100)/100;
  if(c<1)c=1;if(c>capOf(g))c=capOf(g);
  return c;
}
function drawCr(skin,t,m,st,limit=CAP){
  const cv=$("cv");if(!cv)return;
  const rect=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  const W=Math.max(320,rect.width||720),H=Math.max(220,rect.height||420);
  const bw=Math.round(W*dpr),bh=Math.round(H*dpr);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
  const x=cv.getContext("2d");if(!x)return;
  x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const bg=x.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,"#07172a");bg.addColorStop(.6,"#0a2740");bg.addColorStop(1,"#04101c");
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  STARS.forEach((a,i)=>{
    const sx=(a[0]*W+(t*8*(i%3+1)))%W,sy=a[1]*H;
    x.fillStyle="rgba(210,235,255,"+(a[2]/3.5)+")";x.beginPath();x.arc(sx,sy,Math.max(.5,a[2]*.7),0,Math.PI*2);x.fill();
  });
  const left=36,right=22,top=25,bottom=34,plotW=W-left-right,plotH=H-top-bottom;
  x.strokeStyle="rgba(174,211,239,.13)";x.lineWidth=1;
  for(let r=0;r<5;r++){const yy=top+plotH*r/4;x.beginPath();x.moveTo(left,yy);x.lineTo(W-right,yy);x.stroke();}
  for(let c=0;c<7;c++){const xx=left+plotW*c/6;x.beginPath();x.moveTo(xx,top);x.lineTo(xx,H-bottom);x.stroke();}
  const elapsed=Math.max(0,Number(t)||0),current=Math.max(1,Math.min(Number(m)||1,limit));
  const tx=Math.max(7,elapsed*1.18),maxM=Math.max(2.1,Math.min(limit,current*1.22));
  const px=v=>left+(v/tx)*plotW;
  const py=v=>top+plotH-((v-1)/(maxM-1))*plotH;
  const points=[];
  for(let i=0;i<=120;i++){
    const sec=elapsed*i/120,mult=Math.min(Math.exp(K*sec),limit);
    points.push({x:px(sec),y:py(mult)});
  }
  if(points.length>1){
    x.beginPath();x.moveTo(points[0].x,H-bottom);
    points.forEach(p=>x.lineTo(p.x,p.y));x.lineTo(points[points.length-1].x,H-bottom);x.closePath();
    const area=x.createLinearGradient(0,top,0,H-bottom);
    area.addColorStop(0,st==="crash"?"rgba(255,84,98,.24)":"rgba(42,220,180,.23)");
    area.addColorStop(1,"rgba(24,128,165,.015)");x.fillStyle=area;x.fill();
    x.beginPath();x.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>x.lineTo(p.x,p.y));
    x.strokeStyle=st==="crash"?"#ff5366":st==="pending"?"#f6b74b":"#37e5c1";
    x.lineWidth=3.5;x.lineJoin="round";x.lineCap="round";x.shadowColor=x.strokeStyle;x.shadowBlur=13;x.stroke();x.shadowBlur=0;
  }
  const planeX=px(elapsed),planeY=py(current);
  if(st==="crash"){
    const radius=18+Math.min(16,(elapsed%2)*10);
    x.save();x.translate(planeX,planeY);x.strokeStyle="#ff7885";x.lineWidth=3;
    for(let i=0;i<12;i++){const a=i*Math.PI/6;x.beginPath();x.moveTo(Math.cos(a)*radius*.45,Math.sin(a)*radius*.45);x.lineTo(Math.cos(a)*radius,Math.sin(a)*radius);x.stroke();}
    x.fillStyle="#ffb25f";x.beginPath();x.arc(0,0,7,0,Math.PI*2);x.fill();x.restore();
  }else{
    const prevSec=Math.max(0,elapsed-.08),nextSec=elapsed+.08;
    const dx=px(nextSec)-px(prevSec),dy=py(Math.min(Math.exp(K*nextSec),limit))-py(Math.min(Math.exp(K*prevSec),limit));
    const angle=Math.atan2(dy,dx)+Math.PI/2;
    x.save();x.translate(planeX,planeY);x.rotate(angle);
    const flame=x.createLinearGradient(0,15,0,36);
    flame.addColorStop(0,"#fff5a0");flame.addColorStop(.35,"#ff9a38");flame.addColorStop(1,"rgba(255,84,35,0)");
    x.fillStyle=flame;x.beginPath();x.moveTo(-5,13);x.quadraticCurveTo(0,23,0,38);x.quadraticCurveTo(8,24,5,13);x.closePath();x.fill();
    x.shadowColor="#5de8ff";x.shadowBlur=18;x.fillStyle="#e9f8ff";x.strokeStyle="#4fa9d1";x.lineWidth=1.4;
    x.beginPath();x.moveTo(0,-29);x.lineTo(5,-7);x.lineTo(24,4);x.lineTo(24,9);x.lineTo(5,5);x.lineTo(8,18);x.lineTo(15,24);x.lineTo(14,28);x.lineTo(0,24);x.lineTo(-14,28);x.lineTo(-15,24);x.lineTo(-8,18);x.lineTo(-5,5);x.lineTo(-24,9);x.lineTo(-24,4);x.lineTo(-5,-7);x.closePath();x.fill();x.stroke();x.shadowBlur=0;x.restore();
  }
  x.textAlign="center";x.textBaseline="middle";x.font="900 "+Math.min(48,Math.max(34,W*.08))+"px Tahoma";
  x.fillStyle=st==="crash"?"#ff7b8b":"#f4fbff";x.shadowColor=st==="crash"?"#ff354d":"#35dbff";x.shadowBlur=18;
  x.fillText("×"+current.toFixed(2),W/2,H*.47);x.shadowBlur=0;
  x.font="bold 14px Tahoma";x.fillStyle=st==="crash"?"#ff9aa4":st==="pending"?"#ffd48a":"#a8cce4";
  const label=st==="crash"?"انتهت الجولة":st==="pending"?"الطيارة وصلت للنهاية • جارٍ تأكيد النتيجة من الخادم":st==="run"?"اسحب قبل انفجار الطيارة":"جاهز للإقلاع";
  x.fillText(label,W/2,H*.47+34);
}

async function crResolve(data,c){
  if(data.active||!U?.cr||U.cr.roundId!==c.roundId)return false;
  U.cr=null;U.balance=Number(data.balance??U.balance);
  const cp=Number(data.crashPoint)||Number(data.multiplier)||1;
  try{await refreshMe(false);}catch(e){console.warn("crash balance refresh",e);}
  crStop();busy=false;hold=false;crLock=false;
  if(data.cashedOut||data.autoSettled){
    crFinal={k:c.k,cp,m:cp,status:"cash"};render();
    result(Number(data.payout||0),Number(data.stake||c.bet),data.autoSettled?"تم السحب التلقائي":"تم السحب عند ×"+Number(data.multiplier||0).toFixed(2));
  }else{
    crFinal={k:c.k,cp,m:cp,status:"crash"};render();
    result(0,Number(data.stake||c.bet),"انفجرت الطيارة عند ×"+cp.toFixed(2));
  }
  return true;
}
function crLoop(){
  if(!raf){
    const frame=()=>{
      const c=U&&U.cr;if(!c){raf=0;return;}
      const serverNow=Date.now()+Number(c.serverOffset||0);
      const elapsed=Math.max(0,(serverNow-Number(c.t0))/1000);
      const multiplier=Math.min(Math.exp(K*elapsed),capOf(cur?.g||{engine:"crash"}));
      if(cur&&cur.g.id===c.k&&!$("gl").hidden){
        drawCr(cur.g.engine,elapsed,multiplier,c.crashDetectedAt?"pending":"run",capOf(cur.g));
        const cb=$("ccash");
        if(cb)cb.textContent=c.cashPending?"جارٍ تأكيد السحب…":C.texts.btnCash+" "+f(c.bet*multiplier);
      }
      raf=requestAnimationFrame(frame);
    };
    raf=requestAnimationFrame(frame);
  }
  if(U&&U.cr&&!crPollTimer){
    const tick=async()=>{
      const c=U&&U.cr;if(!c){crPollTimer=0;return;}
      let delay=170;
      try{
        const sentAt=Date.now(),status=await apiCall("crash_status",{roundId:c.roundId},false),receivedAt=Date.now();
        if(!U?.cr||U.cr.roundId!==c.roundId){crPollTimer=0;return;}
        if(Number.isFinite(Number(status.serverNow))){
          const rtt=receivedAt-sentAt;
          if(rtt<=Number(c.bestRtt||Infinity)){
            c.bestRtt=rtt;c.serverOffset=Number(status.serverNow)-(sentAt+receivedAt)/2;
          }
        }
        if(status.settled||status.active===false){
          await crResolve(status,c);crPollTimer=0;return;
        }
        const multiplier=Number(status.multiplier)||1;
        const cb=$("ccash");
        if(cb&&cur&&cur.g.id===c.k)cb.textContent=c.cashPending?"جارٍ تأكيد السحب…":C.texts.btnCash+" "+f(c.bet*multiplier);
        if(c.cashPending){
          delay=130;
        }else if(status.autoDue){
          if(!c.settlePromise){
            c.settlePromise=(async()=>{
              try{
                const final=await apiCall("crash_tick",{roundId:c.roundId});
                if(final.settled||final.active===null)await crResolve(final,c);
              }catch(e){console.warn("auto crash settlement pending",e);}
            })();
          }
          await c.settlePromise;c.settlePromise=null;delay=120;
        }else if(status.crashed){
          c.crashDetectedAt=c.crashDetectedAt||Date.now();
          if(cur&&cur.g.id===c.k&&!$("gl").hidden)drawCr(cur.g.engine,Number(status.elapsed)||0,multiplier,"pending",capOf(cur.g));
          const remaining=Number.isFinite(Number(status.settleAfter))
            ?Math.max(0,Number(status.settleAfter)-Number(status.serverNow||Date.now())):5500;
          if(remaining<=0&&!c.settlePromise){
            c.settlePromise=(async()=>{
              try{
                const final=await apiCall("crash_tick",{roundId:c.roundId});
                if(final.settled||final.active===null)await crResolve(final,c);
              }catch(e){console.warn("crash settlement pending",e);}
            })();
            await c.settlePromise;c.settlePromise=null;delay=110;
          }else delay=Math.min(180,Math.max(100,remaining));
        }else{
          c.crashDetectedAt=0;
          delay=160;
        }
        c.syncErrors=0;
      }catch(e){
        c.syncErrors=(Number(c.syncErrors)||0)+1;
        if(c.syncErrors===2)gmsg("الاتصال اتأخر؛ بنسترجع حالة الجولة من الخادم…","er");
        delay=Math.min(1000,250+c.syncErrors*120);
      }
      if(U?.cr&&U.cr.roundId===c.roundId)crPollTimer=setTimeout(tick,delay);
      else crPollTimer=0;
    };
    crPollTimer=setTimeout(tick,0);
  }
}

async function crStart(g){
  if(busy||crLock||!U)return;
  const bet=getBet();if(!(bet>0))return gmsg(C.texts.errBetVal,"er");
  let auto=parseFloat(nd($("auto").value));if(!(auto>=1.01))auto=0;
  lastAction=Date.now();busy=true;gmsg("جارٍ بدء الجولة على الخادم...");
  try{
    const sentAt=Date.now(),data=await apiCall("active_start",{gameId:g.id,stake:bet,auto,idempotencyKey:crypto.randomUUID()}),receivedAt=Date.now();
    U.balance=Number(data.balance);
    const offset=Number.isFinite(Number(data.serverNow))?Number(data.serverNow)-(sentAt+receivedAt)/2:0;
    U.cr={k:g.id,bet,t0:Number(data.active.startedAt),auto:Number(data.active.auto)||0,roundId:data.active.id,version:data.active.version,
      serverOffset:offset,bestRtt:receivedAt-sentAt,cashPending:false,syncErrors:0};
    crFinal=null;busy=false;render();gmsg("الجولة بدأت على الخادم. اسحب قبل انفجار الطيارة!");crLoop();
  }catch(e){busy=false;gmsg(e.message||C.texts.errNet,"er");}
}
async function crSettle(mode){
  const c=U?.cr;if(!c)return;
  if(mode!=="cash"){
    if(crLock)return;
    crLock=true;
    try{
      const data=await apiCall("crash_tick",{roundId:c.roundId});
      if(data.settled||data.active===null)await crResolve(data,c);
    }catch(e){gmsg("الخادم لسه بيأكد نتيجة الجولة…","er");}
    finally{crLock=false;}
    return;
  }
  if(c.cashPromise||c.cashPending)return c.cashPromise;
  const clickAt=Date.now()+Number(c.serverOffset||0);
  c.cashPending=true;lastAction=Date.now();upd();
  c.cashPromise=(async()=>{
    let lastError=null;
    for(let attempt=0;attempt<2;attempt++){
      try{
        const data=await apiCall("crash_cash",{roundId:c.roundId,cashClickAt:clickAt});
        if(data.settled||data.active===null){await crResolve(data,c);return;}
        if(data.active){gmsg("الطلب وصل؛ الخادم بيأكد توقيت السحب…","");return;}
      }catch(e){lastError=e;if(attempt===0)await sleep(220);}
    }
    try{
      const status=await apiCall("crash_status",{roundId:c.roundId},false);
      if(status.settled||status.active===false)await crResolve(status,c);
      else gmsg("الطلب اتبعت، ولسه بنسترجع حالة الجولة من الخادم…","");
    }catch(e){
      gmsg("الشبكة اتأخرت. ما تقفلش اللعبة؛ بنحاول نسترجع النتيجة من الخادم…","er");
    }
  })();
  try{await c.cashPromise;}
  finally{
    if(U?.cr&&U.cr.roundId===c.roundId){
      c.cashPending=false;c.cashPromise=null;upd();
    }
  }
}

const WH=[0,0,.3,0,1,0,.5,0,2,0,0,.3,1,0,.5,8,0,0,1,.3];
const WC={0:"#2b3a52",.3:"#8a5a1a",.5:"#8a5a1a",1:"#245A91",2:"#20A464",8:"#d49a10"};
function wv(g){const expected=WH.reduce((a,b)=>a+b,0)/WH.length,scale=(rtpOf(g)/100)/expected;return WH.map(v=>r2(Math.min(v*scale,capOf(g))));}
function wheelDraw(g){
  const cv=$("wcv"),x=cv.getContext("2d"),S=cv.width,c=S/2,R=c-6,n=20,a=2*Math.PI/n,V=wv(g);

    x.fillStyle=WC[WH[i]]||"#245A91";x.fill();x.strokeStyle="#0b1623";x.lineWidth=2;x.stroke();

    x.fillText(V[i]?"×"+V[i]:"0",R-12,0);x.restore();
  }

}

/* ======== Plinko (بديل Nour's Casino، حركة واحدة فقط) ======== */
const PL_ROWS=8,PL_COEF=[1,8,28,56,70,56,28,8,1],PL_RAW=[16,5,2,1.1,.4,1.1,2,5,16];
function plMults(g){
  let exp=0;for(let k=0;k<9;k++)exp+=(PL_COEF[k]/256)*PL_RAW[k];
  const scale=(rtpOf(g)/100)/exp;
  return PL_RAW.map(v=>r2(Math.min(v*scale,capOf(g))));
}
function resetBall(){
  const ball=$("plball");if(!ball)return;
  ball.style.left="50%";ball.style.top="2%";ball.style.transform="translate(-50%,-50%)";
}
ENG.plinko={open(g,b){
  const M=plMults(g);
  b.innerHTML='<div class="gc"><div class="plbd" id="plbd"><div class="plball" id="plball"></div></div><div class="plbuckets" id="plbk">'+M.map((m,i)=>'<div class="plbk" data-i="'+i+'">×'+m+'</div>').join("")+'</div></div>'+
    betBox("",'<button class="btn y full" id="pldrop">'+C.texts.btnDrop+'</button>')+
    rulesBox(tpl(C.texts.rulePlinko,{cap:Math.max(...M),rtp:rtpOf(g)}),g)+histBox;
  bindBet(b);
  const bd=$("plbd");
  for(let r=0;r<PL_ROWS;r++)for(let c=0;c<=r;c++){
    const px=50+(c-r/2)*(80/PL_ROWS);
    const p=el("div","plpeg");p.style.left=px+"%";p.style.top=(12+r*9)+"%";bd.appendChild(p);
  }
  resetBall();
  safeClick($("pldrop"),()=>plDrop(g,M));
  cur.upd=()=>{base();$("hist").innerHTML=histHTML(g);$("pldrop").disabled=busy;};
}};
async function plDrop(g,M){
  if(busy||!U)return;const bet=getBet();if(!(bet>0))return gmsg(C.texts.errBetVal,"er");
  lastAction=Date.now();busy=true;hold=true;plAnimating=true;$("pldrop").disabled=true;
  document.querySelectorAll(".plbk").forEach(x=>x.classList.remove("hit"));
  resetBall();gmsg("...");
  try{
    const data=await apiCall("play",{gameId:g.id,stake:bet,idempotencyKey:crypto.randomUUID()}),o=data.outcome;
    await plAnimate(Number(o.bucket)||0,o.path);
    document.querySelectorAll(".plbk").forEach(x=>x.classList.toggle("hit",Number(x.dataset.i)===Number(o.bucket)));
    await sleep(250);plAnimating=false;hold=false;busy=false;U.balance=Number(data.balance);
    render();result(Number(data.payout),bet,"×"+multText(o.multiplier));
    refreshMe(false).then(()=>render()).catch(()=>{});
  }catch(e){plAnimating=false;hold=false;busy=false;upd();gmsg(e.message||C.texts.errNet,"er");}
}

function plAnimate(targetK,path){
  return new Promise(resolve=>{
    const ball=$("plball");if(!ball){resolve();return;}
    let bits=Array.isArray(path)&&path.length===8?path.map(v=>Number(v)?1:0):null;
    if(!bits){bits=Array(8).fill(0);for(let i=0;i<Math.max(0,Math.min(8,targetK));i++)bits[i]=1;bits.sort(()=>rnd()-.5);}
    const points=[{x:50,y:2},{x:50,y:12}];let bucket=0;
    for(let i=0;i<8;i++){bucket+=bits[i];points.push({x:50+(bucket-(i+1)/2)*10,y:21+i*9});}
    const started=performance.now(),stepMs=225,total=points.length-1;
    function frame(now){
      const elapsed=Math.min(total,(now-started)/stepMs),seg=Math.min(total-1,Math.floor(elapsed)),u=Math.min(1,elapsed-seg);
      const a=points[seg],b=points[seg+1],ease=u*u*(3-2*u),bounce=Math.sin(Math.PI*u)*(seg===0?1.1:2.5);
      ball.style.left=(a.x+(b.x-a.x)*ease)+"%";ball.style.top=(a.y+(b.y-a.y)*ease-bounce)+"%";
      ball.style.transform="translate(-50%,-50%) rotate("+Math.round(elapsed*180)+"deg)";
      if(elapsed<total)requestAnimationFrame(frame);
      else{ball.style.left=points[points.length-1].x+"%";ball.style.top=points[points.length-1].y+"%";ball.style.transform="translate(-50%,-50%) rotate(1440deg)";resolve();}
    }
    requestAnimationFrame(frame);
  });
}

/* ---------- الحسابات والاتصال الآمن بالخادم ---------- */
function mapAccount(data){
  const a=data.user||{},w=data.wallet||{},active=data.active||null;
  return {
    id:a.legacyUserId||a.id,userId:a.id,username:a.username,displayName:a.displayName,role:a.role,closed:false,
    scale:Number(a.scale)||100,gameCaps:a.gameCaps||{},balance:Number(w.balance)||0,rounds:Number(w.rounds)||0,wins:Number(w.wins)||0,losses:Number(w.losses)||0,
    wagered:Number(w.wagered)||0,returned:Number(w.returned)||0,
    hist:(data.history||[]).map(x=>({g:x.g,bet:Number(x.bet),win:Number(x.win),t:Number(x.t),i:x.i})),
    ap:active&&active.gameId==="apple"?{k:active.gameId,bet:Number(active.stake),level:Number(active.level)||0,picks:active.picks||[],safeN:active.safeN||4,hazards:active.revealedHazards||[],roundId:active.id,version:active.version}:null,
    cr:active&&(active.gameId==="crash"||active.gameId==="rocket")?{k:active.gameId,bet:Number(active.stake),t0:Number(active.startedAt),auto:Number(active.auto)||0,roundId:active.id,version:active.version}:null,
    creditRequest:null
  };
}

function setAuth(m){
  authMode=m;$("p2").hidden=m!=="reg";
  $("t_login").className=m==="login"?"on":"";$("t_reg").className=m==="reg"?"on":"";
  $("agb").textContent=m==="reg"?C.texts.btnReg:C.texts.btnLogin;$("aerr").textContent="";
}
async function auth(){
  const reg=authMode==="reg",n=nd($("u").value).trim().toLowerCase(),p=$("p").value,err=t=>$("aerr").textContent=t;
  if(!/^[a-z0-9_]{3,20}$/.test(n))return err("اسم المستخدم من 3 إلى 20 حرف إنجليزي أو أرقام أو _ بدون مسافات");
  if(reg&&p.length<10)return err("كلمة السر الجديدة يجب أن تكون 10 أحرف على الأقل");
  if(!reg&&p.length<1)return err("اكتب كلمة السر");
  if(reg){if(p===n)return err("كلمة السر لازم تختلف عن اسم المستخدم");if(p!==$("p2").value)return err("كلمتا السر غير متطابقتين");}
  err("جارٍ التحقق...");$("agb").disabled=true;
  try{
    const data=await authCall(reg?"register":"login",{username:n,password:p});
    csrfToken=data.csrfToken||"";$("p").value="";$("p2").value="";
    localStorage.removeItem(SESS);localStorage.removeItem("ws_sess3");
    err("");attach(n);
  }catch(e){err(e.message||C.texts.errNet);}
  finally{$("agb").disabled=false;}
}
