<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة المشرف</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
[hidden]{display:none!important}
body{margin:0;background:#0f1a2a;color:#e8eef5;padding:12px 12px 84px;display:flex;justify-content:center}
.w{width:100%;max-width:600px}.card{background:#172a40;border-radius:14px;padding:12px;margin-bottom:10px}
input,button,textarea,select{font-size:16px;padding:10px;border-radius:10px;border:1px solid #35506e}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;margin-bottom:8px;background:#fff;color:#000}
textarea{min-height:80px}button{border:0;background:#20A464;color:#fff;font-weight:bold;cursor:pointer;margin:2px}
button.r{background:#E5484D}button.b{background:#245A91}button.y{background:#d49a10}button.on{background:#20A464}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:#1f3a58;border-radius:12px;padding:10px;text-align:center;font-size:12px}.stat b{display:block;font-size:17px;color:#FFC83D;margin-top:2px}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#08111c;border-top:1px solid #35506e;z-index:5;overflow-x:auto}
.nav button{flex:1 0 auto;min-width:58px;background:none;color:#9fb3c8;font-size:10.5px;padding:8px 2px;border-radius:0;margin:0}
.nav button.on{color:#FFC83D;background:#12223a}.nav button span{display:block;font-size:18px}
.found{background:#14532d;color:#d1fae5;border-radius:10px;padding:8px;text-align:center;margin-bottom:8px;font-weight:bold}
.nf{background:#7f1d1d;color:#fee2e2;border-radius:10px;padding:10px;text-align:center}
.idbig{font-size:22px;font-weight:bold;color:#FFC83D;text-align:center;letter-spacing:2px;margin:6px 0}
.balbig{font-size:26px;font-weight:bold;color:#7CFC00;text-align:center;background:#0b1623;border-radius:12px;padding:12px;margin:8px 0}
.net{border-radius:10px;padding:6px;text-align:center;font-weight:bold;margin:4px 0}.net.up{background:#14532d;color:#d1fae5}.net.dn{background:#7f1d1d;color:#fee2e2}.net.eq{background:#35506e;color:#ddd}
.line{font-size:13px;line-height:2;border-bottom:1px solid #35506e}
.acc{border:1px solid #35506e;border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px;line-height:1.9}
.ctrl{background:#0f1f33;border-radius:10px;padding:8px;margin-top:6px}.sec{font-weight:bold;color:#FFC83D;margin:10px 0 6px}
.hint{font-size:14px;color:#FFC83D;line-height:1.8;margin:8px 0;white-space:pre-line;font-weight:bold}.hint.gray{color:#9fb3c8;font-size:12px;font-weight:normal}
label{display:block;font-size:13px;margin:8px 0 3px}.cl{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.cl input{width:60px;height:38px;padding:2px}
.chips{display:flex;gap:6px;margin-bottom:8px}.chips button{flex:1;font-size:12px}.two{display:flex;gap:8px}.two button{flex:1;padding:14px;font-size:18px}
.gcard{border:1px solid #35506e;border-radius:12px;padding:10px;margin-bottom:10px}
.payimg{max-width:100%;border-radius:10px;margin:8px 0}
.bub{max-width:78%;padding:9px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.bub.me{background:#245A91;color:#fff;margin-right:auto;border-bottom-left-radius:4px}.bub.them{background:#1f3a58;margin-left:auto;border-bottom-right-radius:4px}.bub small{display:block;font-size:10px;opacity:.7;margin-top:3px}
.chatbox{max-height:320px;overflow-y:auto;padding:4px;margin-bottom:8px}.chatin{display:flex;gap:8px}.chatin input{flex:1;margin:0}
#fatal{background:#b00;color:#fff;padding:10px;border-radius:8px;margin-bottom:8px;font-size:13px;direction:ltr;text-align:left}

:root{color-scheme:dark;--admin-gold:#e8bf68;--admin-bg:#080e17;--admin-panel:#121d2b}
body{display:block;min-height:100vh;padding:26px clamp(12px,2.6vw,42px) 110px;background:radial-gradient(ellipse at 50% -15%,#294052 0%,#0c1723 40%,#070b12 100%);color:#f3f0e9}
.w{width:min(100%,1480px);max-width:1480px;margin:0 auto}
#login{width:min(100%,480px);margin:8vh auto 0;padding:clamp(20px,3vw,34px);border:1px solid #8c6b35;border-radius:24px;background:linear-gradient(145deg,#1b2a39,#101a26);box-shadow:0 25px 70px #0009}
#login>b{font-size:21px;color:#f1d38d}
.card{background:linear-gradient(145deg,#18283a,#101a27 80%);border:1px solid #43566c;border-radius:20px;padding:clamp(13px,1.6vw,22px);margin-bottom:16px;box-shadow:0 12px 28px #0004,inset 0 1px #ffffff09}
.stat{border:1px solid #42536a;background:linear-gradient(145deg,#21354a,#142234);padding:17px;border-radius:17px}
.stat b{color:#f0cc79;font-size:clamp(19px,2vw,27px)}.sec{color:#f0cf86;font-size:16px;margin:12px 0 10px}
.found{background:#174b3d;color:#c4ffe8;border:1px solid #379a73}.nf{background:#5d242a;color:#ffe0df;border:1px solid #b45b62}
input,button,textarea,select{font-family:inherit;border-radius:12px}
input[type=text],input[type=password],input[type=number],textarea,select{min-height:44px;background:#f3f6f9;color:#101722;border:1px solid #98a7b8}
button{min-height:40px;background:linear-gradient(135deg,#dcb25c,#916b2e);color:#121923;border:1px solid #f3d28c;box-shadow:0 4px 12px #0004}
button.b{background:linear-gradient(135deg,#3c6789,#244159);border-color:#6188aa;color:#fff}button.r{background:linear-gradient(135deg,#ba4c50,#742c34);border-color:#d47c7e;color:#fff}button.y,button.on{background:linear-gradient(135deg,#dcb25c,#916b2e);color:#111923}
.grid2{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.acc,.gcard{background:linear-gradient(150deg,#172638,#0d1723);border:1px solid #44596f;border-radius:16px;padding:14px}
.line{border-color:#35485b;line-height:1.8;padding:5px 2px;overflow-wrap:anywhere}.hint{color:#f2d28e}.hint.gray{color:#aebfd0}
.chips,.two{display:flex;flex-wrap:wrap;gap:8px}.two button{min-width:130px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(calc(100% - 24px),1440px);max-width:1440px;display:flex;justify-content:space-around;overflow-x:auto;background:rgba(7,16,27,.94);backdrop-filter:blur(18px);border:1px solid #806231;border-radius:19px;padding:6px;box-shadow:0 -8px 35px #0008}
.nav button{flex:1 0 auto;min-width:80px;border-radius:13px;margin:2px}.nav button.on{background:#654e2a;color:#ffe3a4}
#gf{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}#gf>.card{margin:0}
#list,#accbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
#paylog,#chatlist,#chatthread,#txlist{min-width:0}.payimg{max-width:min(100%,720px);max-height:480px;object-fit:contain}
.chatbox{max-height:55vh;border:1px solid #3a5068;border-radius:14px;padding:12px}
@media(min-width:900px){.nav{bottom:14px}.grid2{grid-template-columns:repeat(4,minmax(0,1fr))}.acc{padding:18px}}
@media(max-width:620px){body{padding:10px 8px 100px}#login{margin:6vh auto 0;border-radius:18px}.card{border-radius:16px;padding:12px;margin-bottom:11px}.nav{bottom:0;width:100%;border-radius:16px 16px 0 0;padding:3px;gap:0}.nav button{min-width:48px;font-size:10px;padding:7px 2px}.nav button span{font-size:16px}.two{display:grid;grid-template-columns:1fr 1fr}.two button{min-width:0;font-size:14px;padding:12px 6px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.chips button{min-width:0}.idbig{font-size:19px}}
@media(max-width:380px){.nav button{min-width:43px;font-size:9px}}
</style></head>
<body><div class="w">
<div id="fatal" hidden></div>
<div id="login" class="card"><b>🔐 لوحة المشرف</b><br><br>
  <input type="password" id="pin" placeholder="الرقم السري">
  <button id="go" style="width:100%">دخول</button>
  <div id="err" style="color:#ff8a8f;margin-top:6px"></div>
</div>
<div id="panel" hidden>
  <div id="p1"></div>
  <div id="p2" hidden><div class="card"><b>💰 شحن وسحب بالرقم (ID)</b>
    <input type="text" id="cid" inputmode="numeric" maxlength="12" placeholder="اكتب رقم الحساب (9 أرقام)" style="margin-top:8px">
    <div id="cidmsg" class="hint gray"></div></div><div id="accbox"></div></div>
  <div id="p3" hidden>
    <div class="card"><div class="sec">➕ إنشاء حساب جديد</div>
      <input type="text" id="nn" placeholder="اسم المستخدم (إنجليزي/أرقام)">
      <input type="text" id="np" placeholder="كلمة السر (6 أحرف على الأقل)">
      <input type="text" id="nb" inputmode="decimal" placeholder="الرصيد الابتدائي (فاضي = الافتراضي)">
      <button id="mk" style="width:100%">إنشاء</button><div id="mkmsg" class="hint"></div></div>
    <div class="card"><input type="text" id="q" placeholder="ابحث بالرقم أو الاسم">
      <div class="chips" id="flt"><button data-f="all" class="on">الكل</button><button data-f="win" class="b">🟢 الرابحين</button><button data-f="lose" class="b">🔴 الخاسرين</button></div>
      <div id="fsum" class="hint gray"></div><div id="list"></div></div>
  </div>
  <div id="p4" hidden><div id="gf"></div></div>
  <div id="p5" hidden><div id="paylog"></div></div>
  <div id="p7" hidden><div id="chatlist"></div><div id="chatthread" hidden></div></div>
  <div id="p6" hidden><div class="card"><div class="sec">⋯ المزيد</div>
    <button class="b" style="width:100%;padding:14px" data-s="ppg">📄 الصفحات والأقسام</button>
    <button class="b" style="width:100%;padding:14px" data-s="ptt">💬 كل النصوص</button>
    <button class="b" style="width:100%;padding:14px" data-s="pss">⚙️ الإعدادات والألوان</button>
    <button class="b" style="width:100%;padding:14px" data-s="ptx">📜 سجل العمليات</button></div></div>
  <div id="ppg" hidden><button class="b" data-back>→ رجوع</button><div id="pgf"></div></div>
  <div id="ptt" hidden><button class="b" data-back>→ رجوع</button><div class="card" id="f5"></div></div>
  <div id="pss" hidden><button class="b" data-back>→ رجوع</button><div class="card" id="f6"></div></div>
  <div id="ptx" hidden><button class="b" data-back>→ رجوع</button><div class="card"><b>📜 سجل الشحن والسحب</b><div id="txlist" style="margin-top:8px"></div></div></div>
  <div class="nav">
    <button data-p="p1" class="on"><span>🏠</span>الرئيسية</button><button data-p="p2"><span>💰</span>شحن/سحب</button>
    <button data-p="p3"><span>👥</span>الحسابات</button><button data-p="p4"><span>🎮</span>الألعاب</button>
    <button data-p="p5"><span>💳</span>الدفع</button><button data-p="p7"><span>💬</span>الدردشة</button><button data-p="p6"><span>⋯</span>المزيد</button>
  </div>
</div></div>
<script src="./admin.js" defer></script></body></html>
