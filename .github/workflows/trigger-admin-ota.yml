name: Trigger private admin OTA publication

on:
  push:
    branches:
      - admin-private-domain-fix
    paths:
      - "admin.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the public deployment branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Mark the latest admin source revision for OTA publication
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '{"adminSourceCommit":"%s","triggeredAt":"%s"}\n' "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .ota-admin-source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ota-admin-source.json
          if git diff --cached --quiet; then
            echo "Admin OTA source marker is already current."
          else
            git commit -m "Trigger admin OTA bundle publication"
            git push origin HEAD:main
          fi
