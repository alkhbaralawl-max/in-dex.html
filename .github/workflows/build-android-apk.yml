name: Build Rukn Algharb Android Apps

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "install.html"
      - "install.js"
      - "pwa.js"
      - "sw.js"
      - "icons/**"
      - "android-wrapper/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rukn-android-apps-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build player and private admin APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout player site source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout current private admin source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: admin-private-domain-fix
          path: admin-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Bundle the existing sites inside the two apps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wrapper/player/www/icons android-wrapper/player/assets
          mkdir -p android-wrapper/admin/www android-wrapper/admin/assets android-wrapper/dist
          cp index.html android-wrapper/player/www/index.html
          cp manifest.webmanifest install.html install.js pwa.js sw.js android-wrapper/player/www/
          cp icons/app-icon.svg android-wrapper/player/www/icons/app-icon.svg
          cp icons/app-icon.svg android-wrapper/player/assets/icon.svg
          cp admin-source/admin.html android-wrapper/admin/www/index.html
          cp icons/app-icon.svg android-wrapper/admin/assets/icon.svg
          test -s android-wrapper/player/www/index.html
          test -s android-wrapper/admin/www/index.html
          ! grep -q '"url"' android-wrapper/player/capacitor.config.json
          ! grep -q '"url"' android-wrapper/admin/capacitor.config.json

      - name: Check bundled JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.blocks = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  values = dict(attrs)
                  script_type = values.get("type", "text/javascript").split(";")[0].strip()
                  if "src" not in values and script_type in ("", "text/javascript", "module"):
                      self.current = []

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.blocks.append("".join(self.current))
                      self.current = None

          for app in ("player", "admin"):
              html = Path(f"android-wrapper/{app}/www/index.html").read_text(encoding="utf-8")
              parser = InlineScripts()
              parser.feed(html)
              if not parser.blocks:
                  raise SystemExit(f"{app}: no inline JavaScript found")
              for index, source in enumerate(parser.blocks):
                  check_file = Path(f"/tmp/{app}-inline-{index}.js")
                  check_file.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(check_file)], check=True)
              print(f"{app}: {len(parser.blocks)} inline script(s) passed syntax check")
          PY

      - name: Build both standalone Android applications
        shell: bash
        run: |
          set -euo pipefail
          for APP in player admin; do
            APP_DIR="$GITHUB_WORKSPACE/android-wrapper/$APP"
            case "$APP" in
              player) EXPECTED_ID="com.ruknalgharb.player"; OUTPUT_NAME="Rukn-AlGharb-Players.apk" ;;
              admin)  EXPECTED_ID="com.ruknalgharb.admin";  OUTPUT_NAME="Rukn-AlGharb-Admin.apk" ;;
            esac

            cd "$APP_DIR"
            npm install --no-audit --no-fund
            npx cap add android

            # The existing session system uses Secure, HttpOnly, SameSite=None,
            # Partitioned cookies from Supabase. Android WebView blocks third-party
            # cookies by default, so allow them only in this bundled app WebView.
          python3 - <<'PY'
          from pathlib import Path
          import re

          for app in ("player", "admin"):
              root = Path("android-wrapper") / app / "android"
              candidates = list((root / "app/src/main/java").rglob("MainActivity.java"))
              if len(candidates) != 1:
                  raise SystemExit(f"{app}: expected one MainActivity.java, found {len(candidates)}")
              activity = candidates[0]
              original = activity.read_text(encoding="utf-8")
              package = re.search(r"^package\s+([A-Za-z0-9_.]+);", original, re.M)
              if not package:
                  raise SystemExit(f"{app}: MainActivity package declaration missing")
              source = "\n".join([
                  f"package {package.group(1)};",
                  "",
                  "import android.os.Bundle;",
                  "import android.webkit.CookieManager;",
                  "import com.getcapacitor.BridgeActivity;",
                  "",
                  "public class MainActivity extends BridgeActivity {",
                  "    @Override",
                  "    public void onCreate(Bundle savedInstanceState) {",
                  "        super.onCreate(savedInstanceState);",
                  "        CookieManager cookies = CookieManager.getInstance();",
                  "        cookies.setAcceptCookie(true);",
                  "        if (getBridge() != null && getBridge().getWebView() != null) {",
                  "            cookies.setAcceptThirdPartyCookies(getBridge().getWebView(), true);",
                  "        }",
                  "    }",
                  "}",
                  ""
              ])
              activity.write_text(source, encoding="utf-8")
              print(f"{app}: configured the WebView session-cookie policy")
          PY

            npx capacitor-assets generate --android --assetPath assets \
              --iconBackgroundColor "#080806" \
              --iconBackgroundColorDark "#080806" \
              --splashBackgroundColor "#080806" \
              --splashBackgroundColorDark "#080806"
            npx cap sync android

            cd android
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
            APK="app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='$EXPECTED_ID'"
            cp "$APK" "$GITHUB_WORKSPACE/android-wrapper/dist/$OUTPUT_NAME"
            cd "$GITHUB_WORKSPACE"
          done

          cd android-wrapper/dist
          sha256sum Rukn-AlGharb-Players.apk Rukn-AlGharb-Admin.apk > SHA256SUMS.txt
          ls -lh Rukn-AlGharb-Players.apk Rukn-AlGharb-Admin.apk SHA256SUMS.txt

      - name: Upload both installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: Rukn-AlGharb-Two-Android-Apps
          path: |
            android-wrapper/dist/Rukn-AlGharb-Players.apk
            android-wrapper/dist/Rukn-AlGharb-Admin.apk
            android-wrapper/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
