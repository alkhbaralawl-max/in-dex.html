<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080806">
  <title>ركن الغرب</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080806;color:#f6e6bf;font-family:Tahoma,Arial,sans-serif;text-align:center}
    main{max-width:380px;padding:28px;border:1px solid #8b6729;border-radius:22px;background:linear-gradient(145deg,#211808,#0c0905)}
    h1{color:#f4d17b;font-size:24px;margin:0 0 12px}
    p{line-height:1.9;color:#d2c29c;font-size:14px;margin:0}
  </style>
</head>
<body>
  <main>
    <h1>ركن الغرب</h1>
    <p>يلزم اتصال بالإنترنت لفتح التطبيق. تأكد من اتصالك ثم أعد المحاولة.</p>
  </main>
</body>
</html>
